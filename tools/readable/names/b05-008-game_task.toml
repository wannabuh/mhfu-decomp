confidence = "inferred"
evidence = "Same block shape as 9AB7520 with opcode 0x0B; compares the argument with +0x4B9."

[[function]]
module = "game_task"
address = "09AB7728"
name = "monster_script_skip_to_opcode_subcode"
purpose = "Walks forward instruction by instruction to the given opcode with a nonzero sub-code or to a 0x95 byte, recursively stepping over nested blocks that open with that opcode and sub-code 0; after 1000 steps it resets +0x500 to 0 and restarts from the main entry."
confidence = "inferred"
evidence = "Uses 9AB7858 to step, recurses on (opcode, 0) until (opcode, param_4), and has a step guard of 1000."

[[function]]
module = "game_task"
address = "09AB7858"
name = "monster_script_next_instruction"
purpose = "Returns the address after the script instruction at the pointer, using each opcode's and sub-code's fixed length, without executing it."
confidence = "inferred"
evidence = "Long opcode chain that only computes param_2 plus a length; the skip routines 9AB7728 and 9AB8A38 step with it."

[[function]]
module = "game_task"
address = "09AB8A38"
name = "monster_script_skip_past_block_end"
purpose = "Advances to the given opcode with sub-code 2 and returns the address after that instruction."
confidence = "inferred"
evidence = "Loops 9AB7728 until (param_3, 2), then calls 9AB7858; if/else handlers use it for sub-code 1."

[[function]]
module = "game_task"
address = "09AB8AE0"
name = "monster_script_op_80_weighted_branch"
purpose = "Handler for opcode 0x80: sub-code 0 walks a count of case headers summing their weight bytes and enters the first case whose running total exceeds (+0x322 & 0x1F), or one of weight 0xFF; sub-codes 1 to 0x0D, reached at the end of a case, skip to the (0x80,0xFF) end."
confidence = "inferred"
evidence = "Cumulative weight loop against the low bits of +0x322, stepping with 9AB7728(0x80,0xFF); opcode 0x7B or 0x84 in 9AB4C68 increments +0x322 through 9AC4518."

[[function]]
module = "game_task"
address = "09AB8E48"
name = "monster_script_op_06_set_target_spec"
purpose = "Handler for opcode 6: stores a target kind in +0x506 and its parameters in +0x508 and +0x504; kind 0x0D searches the 20-slot object table for another object with the same +0x29A, kind 10 becomes kind 3 using the +0x29A of itself or of a hunter slot, and kind 3 takes a 16-bit value remapped through tables."
confidence = "inferred"
evidence = "Decodes script bytes into +0x504/+0x506/+0x508, which 9AB9170 reads to resolve a position."

[[function]]
module = "game_task"
address = "09AB9170"
name = "monster_script_resolve_target_position"
purpose = "Writes a vec3 for the target spec in +0x506/+0x508/+0x504, by kind: a hunter slot's place, table points, a point at a set distance from the object along its angle +0x1F4 plus an offset, a stored point +0x5E0, a list entry, a +0x29A point table entry, or an offset from a hunter-indexed point; it also updates the resolved copy of the spec in +0x50A/+0x50C/+0x50E and, for kinds 1, 0x0B and 0x0D, field +0x2F4."
confidence = "inferred"
evidence = "Switch on +0x506 with every case writing param_2; called by em20 09D1BD98 and script handlers such as 9AB6788 and 9ABCC40 in traces."

