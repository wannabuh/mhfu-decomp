[[function]]
module = "game_task"
address = "09AB4C68"
name = "monster_script_run"
purpose = "Bytecode interpreter for an object's script: unless byte +0x298 is 5 or 6, resumes at a pending entry or the saved position, then dispatches opcodes to handlers (at most 999 steps) until opcode 5 saves the position and suspends, the position is null, or an unknown opcode appears."
confidence = "inferred"
evidence = "Long opcode if-chain whose handlers return the next script pointer; opcode 5 calls 9AB74D0 to save it. The monster prefix rests on the em20 caller of the sibling 9AB9170 and on the object-type table at +0x1E8."

[[function]]
module = "game_task"
address = "09AB6778"
name = "monster_script_on_byte_noop"
purpose = "Empty stub called with the address of each opcode and sub-code byte the script code reads."
confidence = "inferred"
evidence = "Body is a bare return; 9AB4C68 and 9AB7858 pass it script byte addresses."

[[function]]
module = "game_task"
address = "09AB6788"
name = "monster_script_op_ff_end_block"
purpose = "Handler for opcode 0xFF: its sub-code decides how a script block ends, by clearing masks in +0x4C1 (0x1, 0x10, 0x2, 0x4, 0x8), resuming a saved position, jumping to main entry 0, repeating a block table entry under counters +0x533/+0x535, or (sub-codes 4 and 5) walking a per-+0x29A point table, where sub-code 4 can move the object and change +0x29A."
confidence = "inferred"
evidence = "Dispatched from opcode 0xFF in 9AB4C68; each sub-code returns a next script pointer from 9ABAB90, 9ABDB28, 9AC33C8, 9AB7490 or a saved field."

[[function]]
module = "game_task"
address = "09AB7230"
name = "monster_script_take_pending_entry"
purpose = "Checks pending masks in +0x4BB (0x40, 0x80, 0x20, 0x10, 0x8, 0x4, 0x2); for each one 9AC9740 returns 0 for, fetches its script entry, records it in a per-mask slot where one exists, updates +0x4BB and +0x4C1, and returns the first entry found or 0."
confidence = "inferred"
evidence = "Sequence of mask tests in +0x4BB; slots +0x4D0, +0x4D4, +0x4DC, +0x4E4, +0x4E0; 9AB4C68 uses the result as its start position when nonzero."

[[function]]
module = "game_task"
address = "09AB7490"
name = "monster_script_get_saved_position"
purpose = "Returns the saved script position chosen by +0x4C1: +0x4D0 for mask 0x20, else +0x4D4 for mask 0x10, else +0x4D8 for mask 0x1, else +0x4CC."
confidence = "inferred"
evidence = "Mask ladder returning fields; 9AB4C68 resumes from the result, and 9AB74D0 writes the same slots."

[[function]]
module = "game_task"
address = "09AB74D0"
name = "monster_script_set_saved_position"
purpose = "Stores a script position into the slot chosen by +0x4C1: +0x4D0 for mask 0x20, else +0x4D4 for mask 0x10, else +0x4D8 for mask 0x1, else +0x4CC."
confidence = "inferred"
evidence = "Same mask ladder as 9AB7490 but writing; opcode 5 in 9AB4C68 passes it the next script pointer before suspending."

[[function]]
module = "game_task"
address = "09AB7510"
name = "monster_script_op_07_jump_main_entry"
purpose = "Handler for opcode 7: stores its byte argument in +0x500 and returns that entry of the main table via 9ABAB90."
confidence = "inferred"
evidence = "Dispatched from opcode 7; 9ABAB90 indexes the table at +0x4C8 by +0x500."

[[function]]
module = "game_task"
address = "09AB7520"
name = "monster_script_op_39_if_field_4c4_nonzero"
