name = "collision_floor_height_and_surface_for_object"
purpose = "For an object in the current map (else table heights and zero surface), tests up to 5 upward-facing triangles of the grid +0x214 cell under the point and writes to param_5 the highest plane height at or below point y + 50 (+100 once a mask 0x80 triangle set object flag 0x40), or the lowest if none qualify, to param_4 that triangle's first 4 bytes, and to param_6 the mask 0x80 or mask 0x20 triangle's height (mask 0x20 less object +0x2A8), updating object +0x410 masks 0x20 and 0x40."
confidence = "inferred"
evidence = "Plane equation y = -(d + a*x + c*z) / b with b > 0; attribute table from DAT_09a4f1a0 vtable +0x28; 9C3A460 checks the +0x214 grid's bounds; runs through whole hunts."

