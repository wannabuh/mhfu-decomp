# Names of classes found by classes.py. See docs/readable.md, "Classes and fields". vtable: the class; base: the parent's name, if named.
# Monster species come from the type allocator game_task 09AB16D8 (its switch on type byte +0x1E8 picks the vtable) and the game's own list of
# monster names (build/ram-003570.bin at file offset 0x1CE39E: NO DATA, Rathian, Fatalis, Kelbi...). The list is not shown to be read by that byte: what supports the
# match is that the 35 groups in the allocator fall into families in it, and that the overlays emNN are named by the same numbers.

