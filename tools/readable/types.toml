# The game's structures: offsets, names and types only, never game code. tools/readable/gen_types.py makes a C header with
# every offset checked at compile time, and the table the view applies. Types: u8 s8 u16 s16 u32 s32 f32, ptr, ptr:Name,
# f32x3, f32x4. `size` only where confirmed; unknown spans stay padding, never guessed fields. `span` is how far offsets are
# known to reach, kept generous: past it the decompiler prints self[1].field_X, which reads wrongly.
# Every class classes.py finds reaches the view, as Class_<vtable> with field_<offset>; what is here names them. `base` says what a
# struct's fields start from: a field goes on the highest class it means the same thing for.
# Confidence as in names/: confirmed (watchpoint, trace, patch), inferred (from code), guess. `decimal`: a quantity, shown in decimal.

[[struct]]
name = "Object"
vtables = ["089BAC64"]
fields = [
  { offset = 0x000, name = "vtable", type = "ptr", confidence = "confirmed" },
  { offset = 0x004, name = "flags", type = "u32", confidence = "confirmed", note = "bit 0 clears: deleted" },
  { offset = 0x010, name = "rotation", type = "f32x4", confidence = "confirmed", note = "first row of a 3x3, rows of 4" },
  { offset = 0x020, name = "rotation_row1", type = "f32x4", confidence = "confirmed" },
  { offset = 0x030, name = "rotation_row2", type = "f32x4", confidence = "confirmed", note = "its local Z: 09A9E288 pushes the hunter along it" },
  { offset = 0x040, name = "position", type = "f32x3", confidence = "confirmed" },
  { offset = 0x1C4, name = "next", type = "ptr", confidence = "confirmed" },
  { offset = 0x1D4, name = "life_state", type = "u8", confidence = "confirmed", note = "0 alive .. 3" },
  { offset = 0x200, name = "place", type = "f32x3", confidence = "confirmed" },
  { offset = 0x210, name = "place_before", type = "f32x3", confidence = "confirmed" },
  { offset = 0x240, name = "velocity", type = "f32x3", confidence = "confirmed" },
  { offset = 0x250, name = "acceleration", type = "f32x3", confidence = "confirmed" },
  { offset = 0x299, name = "state", type = "u8", confidence = "confirmed" },
  { offset = 0x3F4, name = "state_ticks", type = "f32", confidence = "inferred", decimal = true, note = "ticks in its state; monsters' in 60ths" },
  { offset = 0x3FC, name = "state_fn", type = "u32", confidence = "confirmed", note = "member function pointer, 3 words" },
  { offset = 0x414, name = "action_count", type = "s32", confidence = "confirmed", decimal = true },
]

