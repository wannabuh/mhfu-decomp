  { offset = 0x2E4, name = "health", type = "s16", confidence = "inferred", decimal = true, note = "HUD +0x560 steps toward it; 08841AB4 tests it" },
  { offset = 0x324, name = "motion_id", type = "u16", confidence = "inferred", note = "part 0's; 088D1DD0 copies it to +0x684" },
